name: Testes de integração

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore InvoiSys.sln

      - name: Compilar solução
        run: dotnet build InvoiSys.sln --configuration Release --no-restore

      - name: Executar testes de integração
        run: >
          dotnet test
          tests/InvoiSys.IntegrationTests/InvoiSys.IntegrationTests.csproj
          --configuration Release
          --no-build
