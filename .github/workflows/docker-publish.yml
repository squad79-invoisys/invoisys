name: Publicar imagens Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/invoisys-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/invoisys-web

jobs:
  tests:
    name: Restaurar, compilar e testar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restaurar ferramentas locais
        run: dotnet tool restore

      - name: Restaurar dependências
        run: dotnet restore InvoiSys.sln

      - name: Compilar solução
        run: dotnet build InvoiSys.sln --configuration Release --no-restore

      - name: Executar testes unitários
        run: >
          dotnet test
          tests/InvoiSys.UnitTests/InvoiSys.UnitTests.csproj
          --configuration Release
          --no-build

  publish-api:
    name: Publicar imagem da API
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados da API
        id: api-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir e publicar API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/InvoiSys.Api/Dockerfile
          push: true
          tags: ${{ steps.api-metadata.outputs.tags }}
          labels: ${{ steps.api-metadata.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  publish-web:
    name: Publicar imagem Web
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados da Web
        id: web-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir e publicar Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/InvoiSys.Web/Dockerfile
          push: true
          tags: ${{ steps.web-metadata.outputs.tags }}
          labels: ${{ steps.web-metadata.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
