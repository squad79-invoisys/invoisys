server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Mudam a cada deploy ou a cada start do container: o navegador sempre
    # revalida, senão continuaria carregando a versão antiga.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|wasm|dat|json|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}
