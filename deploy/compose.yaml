services:
  postgres:
    image: postgres:18-alpine
    container_name: invoisys-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoisys}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: src/InvoiSys.Api/Dockerfile
    image: invoisys-api:local
    container_name: invoisys-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__invoisys: Host=postgres;Port=5432;Database=${POSTGRES_DB:-invoisys};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-5056}
      Jwt__Key: ${JWT_KEY}
      BootstrapAdmin__Nome: ${BOOTSTRAP_ADMIN_NAME:-Administrador}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: src/InvoiSys.Web/Dockerfile
      args:
        API_BASE_URL: http://localhost:${API_PORT:-8080}/
    image: invoisys-web:local
    container_name: invoisys-web
    ports:
      - "${WEB_PORT:-5056}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
